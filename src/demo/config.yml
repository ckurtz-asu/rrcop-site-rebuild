backend:
  name: github
  repo: ckurtz-asu/rrcop-site-rebuild
  branch: main
  base_url: https://rrcop-site-rebuild.kristoff.workers.dev
  auth_endpoint: api/demo-auth

# Demo instance -- points at the REAL repo so visitors see real content, but
# auth_endpoint targets a route with no OAuth App wired up (see _worker.js).
# Clicking "Login with GitHub" will fail cleanly at GitHub's own authorize
# screen (invalid client_id) rather than silently doing nothing -- nobody
# can ever obtain a real write token through this instance.
# For the real editing experience (commits to GitHub), see /admin instead.

publish_mode: editorial_workflow

media_folder: "src/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home"
        name: "home"
        file: "src/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "About"
        name: "about"
        file: "src/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "resources"
    label: "Resources"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Order", name: "order", widget: "number", default: 0 }
      - { label: "Summary", name: "summary", widget: "string", required: false }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "boolean", default: false, required: false }
      - { label: "Body", name: "body", widget: "markdown" }
